<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>爬虫 · 图集岛</title>
<script src="vue.global.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #app { min-height:100vh; }
  .dark  body-bg { }
  .page { min-height:100vh; padding:14px 16px 40px; }
  .page.dark { background:#000; color:#fff; }
  .page.light { background:#EEF4FF; color:#1F2329; }

  .top { display:flex; align-items:center; gap:10px; padding:6px 0 16px; }
  .back { font-size:22px; padding:2px 10px; cursor:pointer; }
  .ttl { font-size:19px; font-weight:700; flex:1; }
  .login { font-size:13px; padding:7px 14px; border-radius:20px; border:none; font-weight:600; }
  .login.yes { background:#1FA855; color:#fff; }
  .login.no  { background:#315CDE; color:#fff; }

  .hint { font-size:13px; padding:10px 14px; border-radius:14px; margin-bottom:12px; }
  .dark .hint { background:#15181E; color:#9AA3AE; }
  .light .hint { background:#fff; color:#8A94A6; }

  .card { border-radius:16px; padding:14px; margin-bottom:10px; }
  .dark .card { background:#15181E; }
  .light .card { background:#fff; }
  .row1 { display:flex; align-items:center; gap:10px; }
  .cid { font-size:12px; color:#8A94A6; flex-shrink:0; }
  .cname { flex:1; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn { font-size:13px; font-weight:600; border:none; border-radius:14px; padding:7px 14px; color:#fff; background:#315CDE; }
  .btn.stop { background:#D9534F; }
  .btn[disabled] { opacity:.5; }
  .bar { height:6px; border-radius:3px; margin-top:10px; overflow:hidden; background:rgba(127,127,127,.25); }
  .bar i { display:block; height:100%; background:#4666DB; transition:width .2s; }
  .pinfo { font-size:12px; color:#8A94A6; margin-top:6px; }

  .pager { display:flex; align-items:center; justify-content:center; gap:18px; padding:18px 0 4px; }
  .pg { font-size:14px; padding:9px 22px; border-radius:20px; border:none; font-weight:600; color:#fff; background:#4666DB; }
  .pg[disabled] { opacity:.4; }
  .pnum { font-size:14px; opacity:.75; }
  .empty { text-align:center; padding:60px 0; opacity:.55; font-size:14px; }
  .spin { text-align:center; padding:40px 0; font-size:14px; opacity:.6; }
</style>
</head>
<body>
<div id="app">
  <div :class="['page', theme]">
    <div class="top">
      <span class="back" @click="goBack">‹</span>
      <span class="ttl">🕷️ 爬虫 · 图集岛</span>
      <button class="login" :class="logged?'yes':'no'" @click="logged?noop():doLogin()">{{ logged ? '已登录 ✓' : '登录图集岛' }}</button>
    </div>

    <div class="hint" v-if="hint">{{ hint }}</div>

    <div class="spin" v-if="loading">加载中…</div>
    <div class="empty" v-else-if="items.length===0">暂无数据</div>

    <div class="card" v-for="it in items" :key="it.id">
      <div class="row1">
        <span class="cid">#{{ it.id }}</span>
        <span class="cname">{{ it.name }} · {{ it.total }}P</span>
        <button class="btn" :class="{stop: prog[it.id] && prog[it.id].state==='run'}"
                @click="toggle(it)">
          {{ btnText(it) }}
        </button>
      </div>
      <div class="bar" v-if="prog[it.id] && prog[it.id].done>0">
        <i :style="{width: (prog[it.id].total>0 ? Math.min(100, prog[it.id].done/prog[it.id].total*100) : 0)+'%'}"></i>
      </div>
      <div class="pinfo" v-if="prog[it.id] && prog[it.id].done>0">
        {{ prog[it.id].done }} / {{ prog[it.id].total }} ·
        {{ prog[it.id].state==='run' ? '下载中' : prog[it.id].state==='done' ? '✓ 完成(相册 Pictures/图集岛)' : prog[it.id].state==='cancel' ? '已停止' : '' }}
      </div>
    </div>

    <div class="pager">
      <button class="pg" :disabled="page<=1||loading" @click="page--;load()">上一页</button>
      <span class="pnum">第 {{ page }} 页</span>
      <button class="pg" :disabled="loading||stopNext" @click="page++;load()">下一页</button>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive, onMounted } = Vue;
createApp({
  setup() {
    const theme  = ref('light');
    const logged = ref(false);
    const items  = ref([]);
    const prog   = reactive({});
    const page   = ref(1);
    const loading= ref(false);
    const hint   = ref('');
    const stopNext = ref(false);

    const doLogin = () => { hint.value='登录完成回来自动检测，登录后点列表刷新'; And.login(); };
    const noop = () => {};
    const goBack = () => { try { And.exit(); } catch(e) { } };

    function load() {
      loading.value = true; hint.value=''; stopNext.value=false;
      setTimeout(() => {
        const r = And.list(page.value);
        loading.value = false;
        try {
          const d = JSON.parse(r);
          if (d.err === 'notlogin') {
            items.value = []; logged.value = false;
            hint.value = '⚠️ 还没有登录：点右上「登录图集岛」，登录成功后回来下拉刷新';
          } else if (d.err) {
            items.value = [];
            hint.value = '❌ ' + d.err;
          } else {
            items.value = d.items || [];
            logged.value = true;
            stopNext.value = (d.items||[]).length === 0;
          }
        } catch(e) { hint.value = '❌ 解析失败: ' + e; }
      }, 50);
    }

    function toggle(it) {
      const p = prog[it.id];
      if (p && p.state === 'run') { And.cancel(it.id); return; }
      prog[it.id] = { done:0, total:it.total, state:'run' };
      And.download(it.id, it.name, it.total);
    }
    function btnText(it) {
      const p = prog[it.id];
      if (!p || p.state==='done') return '下载';
      if (p.state==='cancel') return '继续';
      return '停止';
    }

    window.__andEvent = function(type, json) {
      try {
        if (type === 'prog') {
          const d = JSON.parse(json);
          prog[d.id] = { done:d.done, total:d.total, state:d.state };
        }
      } catch(e) {}
    };

    onMounted(() => {
      theme.value = And.theme();
      logged.value = And.loginState() === 'yes';
      load();
    });
    // 回到页面时刷新登录态
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { logged.value = And.loginState()==='yes'; }
    });

    return { theme, logged, items, prog, page, loading, hint, stopNext, doLogin, noop, goBack, load, toggle, btnText };
  }
}).mount('#app');
</script>
</body>
</html>
