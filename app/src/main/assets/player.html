<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>资源嗅探播放器</title>
<style>
*{margin:0;padding:0}
body{background:#000;height:100vh;overflow:hidden}
#container{width:100vw;height:100vh}
#err{position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;font-size:12px;padding:4px;display:none}
#info{position:fixed;bottom:0;left:0;right:0;color:#8ab4f8;font-size:11px;padding:2px;background:#66000000}
</style>
</head>
<body>
<div id="container"></div>
<div id="err"></div>
<div id="info"></div>
<script src="jessibuca.js"></script>
<script>
function showErr(m){var d=document.getElementById('err');d.style.display='block';d.textContent='播放错误: '+m;}
var qs=new URLSearchParams(location.search);
var url=qs.get('url')||'';
var isLive=(qs.get('live')||'')==='1';
var title=qs.get('title')||url;
document.getElementById('info').textContent='▶ '+title+'  ·  '+url;
if(!url){showErr('无播放地址');}
else{
  try{
    var player=new Jessibuca({
      container: document.getElementById('container'),
      videoBuffer: 0.2,
      isResize: true,
      loadingText: '加载中...',
      debug: false,
      showBandwidth: true,
      operateBtns: {fullscreen:true, screenshot:false, play:true, audio:true, record:false},
      forceNoOffscreen: true,
      isNotMute: false,
      decoder: 'decoder.js'
    });
    player.on('error', function(e){ showErr(JSON.stringify(e)); });
    if(isLive){ player.play(url); } else { player.play(url); }
  }catch(e){ showErr(e.message||String(e)); }
}
window.onerror=function(m){showErr(m);};
</script>
</body>
</html>
