<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>资源嗅探播放器</title>
<style>
*{margin:0;padding:0}
body{background:#000;height:100vh;overflow:hidden}
#container{width:100vw;height:100vh}
#bar{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;justify-content:space-between;align-items:center;background:#66000000;padding:4px 8px}
#bar span{color:#8ab4f8;font-size:11px}
button{background:#4D1677FF;color:#fff;border:0;border-radius:8px;font-size:12px;padding:5px 10px;margin-left:6px}
#err{position:fixed;bottom:0;left:0;right:0;background:#c0392b;color:#fff;font-size:12px;padding:4px;display:none}
</style>
</head>
<body>
<div id="container"></div>
<div id="bar">
  <span id="info">▶ 加载中</span>
  <button onclick="useNative()">系统内核</button>
  <button onclick="replay()">网页内核</button>
</div>
<div id="err"></div>
<script src="jessibuca.js"></script>
<script>
var url = (window.AndroidPlayer && AndroidPlayer.getUrl()) || '';
var title = '资源嗅探';
var player = null;
function showErr(m){var d=document.getElementById('err');d.style.display='block';d.textContent='播放错误: '+m;}
function setInfo(){document.getElementById('info').textContent='▶ '+title+' · '+(url.length>60?url.slice(0,60)+'…':url);}
function useNative(){
  if(window.AndroidPlayer && AndroidPlayer.openNative){ AndroidPlayer.openNative(url, title); }
  else showErr('原生内核不可用');
}
function replay(){ destroyPlayer(); initPlayer(); }
function destroyPlayer(){ try{ if(player){ player.pause(); player.destroy(); } }catch(e){} player=null;
  try{ document.getElementById('container').innerHTML=''; }catch(e){}
}
function initPlayer(){
  if(!url){ showErr('无播放地址'); return; }
  if(player) return;
  try{ document.getElementById('container').innerHTML=''; }catch(e){}
  try{
    player = new Jessibuca({
      container: document.getElementById('container'),
      videoBuffer: 0.2, isResize: true, debug: false,
      showBandwidth: true, forceNoOffscreen: true, isNotMute: false,
      decoder: 'decoder.js',
      operateBtns: {fullscreen:true, play:true, audio:true}
    });
    player.on('error', function(e){ showErr(JSON.stringify(e)); });
    player.play(url);
    setInfo();
  }catch(e){ showErr(e.message||String(e)); }
}
initPlayer();
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && !player){ initPlayer(); }
});
</script>
</body>
</html>
