<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>娱乐</title>
<link rel="stylesheet" href="./style.css">
<style>
  body{background:#14161c;font-family:-apple-system,'PingFang SC',sans-serif;color:#eee;margin:0}
  .tabs{display:flex;padding:12px 16px 0;gap:10px}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:20px;background:#1c1f26;font-size:15px}
  .tab.on{background:#315CDE;font-weight:bold}
  .wrap{padding:10px 16px 30px}
  #cfgBtn{position:fixed;right:14px;bottom:24px;background:#e67e22;color:#fff;border:none;border-radius:24px;padding:10px 18px;font-size:14px;font-weight:bold;z-index:9}
  .cfg{display:none;background:#1c1f26;border-radius:14px;padding:14px;margin-top:12px}
  .cfg textarea{width:100%;height:110px;background:#0c0e12;color:#eee;border:none;border-radius:10px;padding:10px;font-size:13px;box-sizing:border-box;resize:vertical}
  .cfg .row{margin-top:10px;text-align:right}
  .cfg button{background:#1FA855;color:#fff;border:none;border-radius:14px;padding:8px 16px;font-size:13px}
  .cfg .tip{font-size:11px;color:#888;margin-top:8px;line-height:1.5}
  .result{display:block;width:300px;height:172px;margin:20px auto;border-radius:10px}
  #dialWrap{width:320px;height:320px;margin:24px auto;position:relative}
  #wheel{width:320px;height:320px;transition:transform 4.2s cubic-bezier(.17,.67,.12,.99)}
  #dialGo{position:absolute;top:50%;left:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#ff9a56,#e6450a);color:#fff;border:4px solid #fff;
    font-size:17px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:2}
  .dresult{text-align:center;font-size:15px;color:#ffd28a;margin-top:8px;min-height:22px}
</style>
</head>
<body>
<div class="tabs">
  <div class="tab on" id="tabCard" onclick="switchTab('card')">🎫 刮刮卡</div>
  <div class="tab" id="tabDial" onclick="switchTab('dial')">🎡 大转盘</div>
</div>
<div class="wrap">
  <!-- 刮刮卡 -->
  <div id="paneCard">
    <canvas class="m-ui-scratch" id="js_lottery"></canvas>
    <button class="m-ui-button" onclick="resetCard()">再来一次</button>
  </div>
  <!-- 大转盘 -->
  <div id="paneDial" style="display:none">
    <div id="dialWrap">
      <canvas id="wheel" width="640" height="640"></canvas>
      <div id="dialGo" onclick="spin()">GO</div>
    </div>
    <div class="dresult" id="dialResult"></div>
    <button class="m-ui-button" onclick="drawDial()">转起来</button>
  </div>
  <!-- 自定义 -->
  <button id="cfgBtn" onclick="toggleCfg()">⚙ 自定义</button>
  <div class="cfg" id="cfgPane">
    <div class="tip">刮刮卡奖项（每行一个，第一行为"谢谢惠顾"类结果）：</div>
    <textarea id="cfgCard">谢谢惠顾
再来一次
 +10 积分
奖品 · 小锦囊
大奖 · 心愿达成</textarea>
    <div class="tip" style="margin-top:10px">大转盘奖项（每行一个扇区，2-12个）：</div>
    <textarea id="cfgDial">谢谢参与
再来一次
 +5 积分
 +20 积分
神秘礼物
双倍奖励
幸运大奖
谢谢参与</textarea>
    <div class="row"><button onclick="saveCfg()">保存</button></div>
  </div>
</div>
<script src="./card.js"></script>
<script>
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var cardPrizes=lsGet('cardPrizes',null)||document.getElementById('cfgCard').value;
var dialPrizes=lsGet('dialPrizes',null)||document.getElementById('cfgDial').value;
document.getElementById('cfgCard').value=cardPrizes;
document.getElementById('cfgDial').value=dialPrizes;

function switchTab(t){
  document.getElementById('tabCard').className='tab'+(t==='card'?' on':'');
  document.getElementById('tabDial').className='tab'+(t==='dial'?' on':'');
  document.getElementById('paneCard').style.display=t==='card'?'block':'none';
  document.getElementById('paneDial').style.display=t==='dial'?'block':'none';
  if(t==='dial')drawWheel();
}
function toggleCfg(){
  var p=document.getElementById('cfgPane');
  p.style.display=p.style.display==='block'?'none':'block';
}
function saveCfg(){
  cardPrizes=document.getElementById('cfgCard').value;
  dialPrizes=document.getElementById('cfgDial').value;
  lsSet('cardPrizes',cardPrizes);lsSet('dialPrizes',dialPrizes);
  document.getElementById('cfgPane').style.display='none';
  resetCard();drawWheel();
}

// ---------- 刮刮卡: 结果层用canvas渲染自定义文字 ----------
function cardList(){return cardPrizes.split('\n').map(function(s){return s.trim()}).filter(Boolean)}
function pickCard(){var l=cardList();return l[Math.floor(Math.random()*l.length)]||'谢谢惠顾'}
function resultCanvas(text){
  var c=document.createElement('canvas');c.width=300;c.height=172;
  var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,300,172);
  g.addColorStop(0,'#ffd28a');g.addColorStop(1,'#ff9a56');
  x.fillStyle=g;x.fillRect(0,0,300,172);
  x.fillStyle='#7a2c00';x.font='bold 26px sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText(text.substring(0,12),150,86);
  return c.toDataURL();
}
var card=null;
function resetCard(){
  var prize=pickCard();
  var img=new Image();
  img.onload=function(){
    if(card)card.reset&&card.reset();
    card=new LotteryCard(document.getElementById('js_lottery'),{cover:img,percent:55});
    card.on('start',function(){card.setResult(resultCanvas(prize));
      setTimeout(function(){try{document.querySelector('.m-ui-scratch').style.background='center/100% url('+resultCanvas(prize)+') no-repeat'}catch(e){}},50);
    }).on('end',function(){});
  };
  img.src='images/placeholder.jpg';
}
resetCard();

// ---------- 大转盘: canvas自绘扇区 ----------
var dialList=function(){return dialPrizes.split('\n').map(function(s){return s.trim()}).filter(Boolean)};
var angle=0,spinning=false;
function drawWheel(){
  var l=dialList();if(l.length<2)l=['谢谢参与','再来一次'];
  var c=document.getElementById('wheel'),x=c.getContext('2d');
  var cx=320,r=300,n=l.length,step=2*Math.PI/n;
  var colors=['#e6450a','#f5a623','#2e8b57','#315CDE','#8e44ad','#d65db1','#16a085','#c0392b','#2980b9','#f39c12','#27ae60','#7f8c8d'];
  x.clearRect(0,0,640,640);
  for(var i=0;i<n;i++){
    x.beginPath();x.moveTo(cx,cx);
    x.arc(cx,cx,r,i*step-Math.PI/2,(i+1)*step-Math.PI/2);
    x.fillStyle=colors[i%colors.length];x.fill();
    x.strokeStyle='#14161c';x.lineWidth=4;x.stroke();
    x.save();
    x.translate(cx,cx);x.rotate(i*step+step/2);
    x.fillStyle='#fff';x.font='bold 30px sans-serif';x.textAlign='center';
    var txt=l[i].length>6?l[i].substring(0,6):l[i];
    x.fillText(txt,r*0.62,10);
    x.restore();
  }
  x.beginPath();x.arc(cx,cx,60,0,2*Math.PI);x.fillStyle='#14161c';x.fill();
}
function pickDial(){var l=dialList();return Math.floor(Math.random()*l.length)}
function spin(){
  if(spinning)return;spinning=true;
  var l=dialList();if(l.length<2)l=['谢谢参与','再来一次'];
  var idx=pickDial(),n=l.length,step=360/n;
  // 让指针(顶部)停在 idx 扇区中心
  var target=360*5+270-(idx*step+step/2);
  angle=(angle%360);
  target+=Math.ceil(angle/360)*360;
  document.getElementById('wheel').style.transform='rotate('+target+'deg)';
  document.getElementById('dialResult').textContent='';
  setTimeout(function(){
    spinning=false;
    document.getElementById('dialResult').textContent='🎉 '+(l[idx]||'谢谢参与');
  },4400);
}
function drawDial(){spin()}
drawWheel();
</script>
</body>
</html>
