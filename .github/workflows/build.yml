name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      vc:
        description: 'versionCode'
        default: '5'
      vn:
        description: 'versionName'
        default: '3.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          bash build.sh
        env:
          VC: ${{ github.event.inputs.vc || '5' }}
          VN: ${{ github.event.inputs.vn || '3.0' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 资源嗅探_v${{ github.event.inputs.vn || '3.0' }}
          path: 资源嗅探_v${{ github.event.inputs.vn || '3.0' }}.apk
